<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내리GO - 버스 하차 도착 알람</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 40px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .app-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #111;
        }
        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .download-btn {
            display: inline-block;
            background-color: #007aff;
            color: white;
            font-size: 17px;
            font-weight: 700;
            padding: 16px 32px;
            border-radius: 14px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 40px;
        }
        .download-btn:active {
            transform: scale(0.98);
        }
        .features {
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 24px;
        }
        .feature-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .feature-icon {
            font-size: 20px;
            margin-right: 12px;
        }
        .feature-text h3 {
            font-size: 15px;
            font-weight: 700;
            color: #222;
            margin-bottom: 2px;
        }
        .feature-text p {
            font-size: 13px;
            color: #777;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-icon">🚌</div>
        <h1>내리GO</h1>
        <p class="subtitle">버스 졸음 방지 & 완벽한 하차 알람<br>목적지 반경 진입 시 강력한 소리와 진동으로 알려드립니다.</p>

        <!-- ⭐️ 아래 href 링크 주소에 본인의 실제 앱스토어 링크를 넣어주세요! -->
        <a href="https://apps.apple.com/app/id6822344073" class="download-btn">App Store에서 다운로드</a>

        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">🎯</div>
                <div class="feature-text">
                    <h3>정밀한 위치 감시</h3>
                    <p>배터리를 아끼면서도 목적지에 가까워지면 초정밀 GPS 모드로 자동 전환됩니다.</p>
                </div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🔊</div>
                <div class="feature-text">
                    <h3>스마트 오디오 듀킹</h3>
                    <p>유튜브나 음악을 듣고 있어도 소리가 부드럽게 줄어들며 알람이 선명하게 울립니다.</p>
                </div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🗺️</div>
                <div class="feature-text">
                    <h3>간편한 정류장 검색 & 즐겨찾기</h3>
                    <p>자주 가는 정류장을 등록하고 터치 한 번으로 알람을 즉시 시작하세요.</p>
                </div>
            </div>
        </div>

        <div class="footer">
            &copy; 내리GO. All rights reserved.
        </div>
    </div>

</body>
</html>
